function runSyncWithProgress(projectId, endpoint, type, name, force, selectedFiles) {
  const isUpload = type === 'upload';
  const resultKey = isUpload ? 'sync_result_uploaded' : 'sync_result_downloaded';

  // 终止之前的同步
  if (window._syncAbort) window._syncAbort.abort();
  var abortCtrl = new AbortController();
  window._syncAbort = abortCtrl;

  // 移除已有的同步浮窗
  var old = document.getElementById('sync-float');
  if (old) old.remove();

  // 创建浮窗
  var floatEl = document.createElement('div');
  floatEl.id = 'sync-float';
  floatEl.className = 'sync-float';
  // 初始位置：右下角
  floatEl.style.bottom = '20px';
  floatEl.style.right = '20px';
  floatEl.innerHTML =
    '<div class="sync-float-head">' +
      '<span class="sync-spinner"></span>' +
      '<span class="title">' + (isUpload ? '↑ ' : '↓ ') + escapeHtml(name) + '</span>' +
      '<button class="btn-ctrl" onclick="event.stopPropagation();toggleSyncFloat()" title="最小化">—</button>' +
      '<button class="btn-ctrl" onclick="event.stopPropagation();toggleMaxSync()" title="最大化">□</button>' +
      '<button class="btn-ctrl" onclick="event.stopPropagation();closeSyncProgress(\'' + projectId + '\')" title="关闭">×</button>' +
    '</div>' +
    '<div class="sync-float-body">' +
      '<div class="sync-phase" id="sp-phase"><span class="sync-spinner"></span>' + t('sync_phase_connecting') + '</div>' +
      '<div class="sync-bar-wrap"><div class="sync-bar" id="sp-bar"></div></div>' +
      '<div class="sync-stats" id="sp-stats"></div>' +
      '<div class="sync-log" id="sp-log" style="display:none"></div>' +
    '</div>' +
    '<div class="sync-float-resize sync-resize-n" data-dir="n"></div>' +
    '<div class="sync-float-resize sync-resize-s" data-dir="s"></div>' +
    '<div class="sync-float-resize sync-resize-w" data-dir="w"></div>' +
    '<div class="sync-float-resize sync-resize-e" data-dir="e"></div>' +
    '<div class="sync-float-resize sync-resize-nw" data-dir="nw"></div>' +
    '<div class="sync-float-resize sync-resize-ne" data-dir="ne"></div>' +
    '<div class="sync-float-resize sync-resize-sw" data-dir="sw"></div>' +
    '<div class="sync-float-resize sync-resize-se" data-dir="se"></div>';
  document.body.appendChild(floatEl);

  // 拖拽移动
  var headEl = floatEl.querySelector('.sync-float-head');
  var isDragging = false, dragStartX, dragStartY, dragStartLeft, dragStartTop;
  headEl.addEventListener('mousedown', function(e) {
    if (e.target.closest('.btn-ctrl')) return;
    if (floatEl.classList.contains('maximized')) return;
    isDragging = true;
    var rect = floatEl.getBoundingClientRect();
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartLeft = rect.left; dragStartTop = rect.top;
    // 切换到 top/left 定位
    floatEl.style.top = rect.top + 'px';
    floatEl.style.left = rect.left + 'px';
    floatEl.style.bottom = 'auto';
    floatEl.style.right = 'auto';
    e.preventDefault();
  });

  // 拖拽调整大小
  var isResizing = false, resizeDir = '', resizeStartX, resizeStartY, resizeStartW, resizeStartH, resizeStartLeft, resizeStartTop;
  floatEl.querySelectorAll('.sync-float-resize').forEach(function(handle) {
    handle.addEventListener('mousedown', function(e) {
      if (floatEl.classList.contains('maximized')) return;
      isResizing = true;
      resizeDir = handle.dataset.dir;
      var rect = floatEl.getBoundingClientRect();
      resizeStartX = e.clientX; resizeStartY = e.clientY;
      resizeStartW = rect.width; resizeStartH = rect.height;
      resizeStartLeft = rect.left; resizeStartTop = rect.top;
      // 切换到 top/left 定位
      floatEl.style.top = rect.top + 'px';
      floatEl.style.left = rect.left + 'px';
      floatEl.style.bottom = 'auto';
      floatEl.style.right = 'auto';
      e.preventDefault(); e.stopPropagation();
    });
  });

  document.addEventListener('mousemove', function(e) {
    if (isDragging) {
      var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      floatEl.style.left = (dragStartLeft + dx) + 'px';
      floatEl.style.top = Math.max(0, dragStartTop + dy) + 'px';
    }
    if (isResizing) {
      var dx = e.clientX - resizeStartX, dy = e.clientY - resizeStartY;
      var newW = resizeStartW, newH = resizeStartH, newL = resizeStartLeft, newT = resizeStartTop;
      if (resizeDir.indexOf('e') >= 0) newW = Math.max(280, resizeStartW + dx);
      if (resizeDir.indexOf('w') >= 0) { newW = Math.max(280, resizeStartW - dx); newL = resizeStartLeft + (resizeStartW - newW); }
      if (resizeDir.indexOf('s') >= 0) newH = Math.max(120, resizeStartH + dy);
      if (resizeDir.indexOf('n') >= 0) { newH = Math.max(120, resizeStartH - dy); newT = resizeStartTop + (resizeStartH - newH); }
      floatEl.style.width = newW + 'px';
      floatEl.style.height = newH + 'px';
      floatEl.style.left = newL + 'px';
      floatEl.style.top = Math.max(0, newT) + 'px';
    }
  });
  document.addEventListener('mouseup', function() { isDragging = false; isResizing = false; });

  var startTime = Date.now();
  var minimized = false;
  const phaseEl = document.getElementById('sp-phase');
  const barEl = document.getElementById('sp-bar');
  const statsEl = document.getElementById('sp-stats');
  const logEl = document.getElementById('sp-log');
  const p = state.projects.find(x => x.id === projectId);

  function elapsedStr() {
    var sec = Math.floor((Date.now() - startTime) / 1000);
    if (sec < 60) return sec + 's';
    return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
  }
  function speedStr(bytes) {
    var sec = (Date.now() - startTime) / 1000;
    if (sec < 1) return '';
    return ' · ' + formatBytes(Math.round(bytes / sec)) + '/s';
  }
  function setPhase(html, done) {
    if (!phaseEl) return;
    phaseEl.innerHTML = done ? html : '<span class="sync-spinner"></span>' + html;
    // 更新标题栏状态
    var titleEl = floatEl.querySelector('.title');
    if (titleEl && !done) titleEl.textContent = (isUpload ? '↑ ' : '↓ ') + name + ' · ' + elapsedStr();
  }
  function setBar(pct) {
    if (barEl) barEl.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }
  function addLog(text) {
    if (!logEl) return;
    var d = document.createElement('div');
    d.className = 'sync-log-entry';
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStats(parts) {
    if (statsEl) statsEl.innerHTML = parts.map(function(s) {
      return '<div class="sync-stat">' + s + '</div>';
    }).join('');
  }
  function showDone(success, msg) {
    var body = floatEl.querySelector('.sync-float-body');
    if (body) body.innerHTML = '<div class="sync-float-done"><span class="msg ' + (success ? 'ok' : 'err') + '">' + msg + '</span><button class="btn-min" onclick="closeSyncProgress(\'' + projectId + '\')" title="关闭">×</button></div>';
    var spinner = floatEl.querySelector('.sync-spinner');
    if (spinner) spinner.remove();
    var titleEl = floatEl.querySelector('.title');
    if (titleEl) titleEl.textContent = (success ? '✓ ' : '✗ ') + name;
    // 10秒后自动关闭
    setTimeout(function() { closeSyncProgress(projectId); }, success ? 10000 : 30000);
  }

  (async () => {
    try {
      var url = API_BASE + '/api/' + endpoint + '/' + projectId;
      var params = [];
      if (force && endpoint === 'sync-upload') params.push('force=true');
      if (selectedFiles && selectedFiles.length > 0) params.push('files=' + encodeURIComponent(JSON.stringify(selectedFiles)));
      if (params.length > 0) url += '?' + params.join('&');
      var res = await fetch(url, {
        method: 'POST', signal: abortCtrl.signal
      });
      if (!res.ok) {
        var errData;
        try { errData = await res.json(); } catch(e2) { errData = null; }
        var errMsg = errData && errData.detail ? errData.detail : ('HTTP ' + res.status);
        setPhase(t('sync_phase_error') + ': ' + errMsg, true);
        showDone(false, t('sync_phase_error'));
        return;
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, {stream: true});
        var lines = buf.split('\n');
        buf = lines.pop();
        for (var li = 0; li < lines.length; li++) {
          var line = lines[li].trim();
          if (!line.startsWith('data: ')) continue;
          try {
            var event = JSON.parse(line.slice(6));
            switch (event.phase) {
              case 'connecting':
                setPhase(t('sync_phase_connecting'));
                break;
              case 'scanning':
                setPhase(t('sync_phase_scanning'));
                break;
              case 'transferring':
                var toT = event.to_transfer || 0;
                var sk = event.skipped || 0;
                setPhase(t('sync_phase_transferring') + ' (0 / ' + toT + ')');
                setStats([
                  '<span class="dot" style="background:var(--accent)"></span>' + toT + ' ' + t('sync_files_to_transfer'),
                  '<span class="dot" style="background:var(--text-tertiary)"></span>' + sk + ' ' + t('sync_files_skipped')
                ]);
                if (toT === 0) { setBar(100); setPhase(t('sync_phase_done'), true); showDone(true, t('sync_phase_done')); }
                break;
              case 'file':
                if (logEl) logEl.style.display = '';
                var cur = event.current || 0;
                var tot = event.to_transfer || 1;
                setPhase(t('sync_phase_transferring') + ' (' + cur + ' / ' + tot + ') — ' + elapsedStr());
                setBar((cur / tot) * 100);
                addLog((isUpload ? '\u2191 ' : '\u2193 ') + event.file);
                break;
              case 'batch':
                var bytes = event.bytes || 0;
                var totalB = event.total_bytes || 1;
                var pct = Math.min(99, (bytes / totalB) * 100);
                var filesN = event.to_transfer || 0;
                setPhase(formatBytes(bytes) + ' / ' + formatBytes(totalB) + ' (' + filesN + ' ' + t('sync_files_unit') + ')' + speedStr(bytes) + ' · ' + elapsedStr());
                setBar(pct);
                break;
              case 'done':
                setBar(100);
                break;
              case 'complete':
                var d = event.data;
                var success = event.success;
                var elapsed = elapsedStr();
                if (p) {
                  p._syncResult = { type: type,
                    uploaded: d.uploaded || d.downloaded || 0, skipped: d.skipped,
                    failed: d.failed, total: d.total, errors: d.errors || [],
                    time: new Date().toLocaleTimeString('zh-CN') };
                }
                setBar(100);
                var transferred = d.uploaded || d.downloaded || 0;
                var summaryMsg = t(resultKey) + ' ' + transferred + ' · ' + t('sync_elapsed') + ' ' + elapsed;
                if (d.failed) summaryMsg += ' · ' + t('sync_result_failed') + ' ' + d.failed;
                var body = floatEl.querySelector('.sync-float-body');
                if (body) {
                  var html = '<div class="sync-summary">';
                  html += '<div class="sync-summary-row"><span>' + t(resultKey) + '</span><span style="font-weight:600;color:var(--accent)">' + transferred + '</span></div>';
                  if (d.skipped) html += '<div class="sync-summary-row"><span>' + t('sync_result_skipped') + '</span><span>' + d.skipped + '</span></div>';
                  if (d.failed) html += '<div class="sync-summary-row error"><span>' + t('sync_result_failed') + '</span><span>' + d.failed + '</span></div>';
                  html += '<div class="sync-summary-row"><span>⏱ ' + t('sync_elapsed') + '</span><span>' + elapsed + '</span></div>';
                  html += '</div>';
                  if (d.errors && d.errors.length > 0) {
                    html += '<div style="margin-top:6px;font-size:11px;color:var(--red)">' + d.errors.slice(0, 5).map(escapeHtml).join('<br>') + '</div>';
                  }
                  html += '<div style="margin-top:8px;text-align:right"><button class="btn btn-sm" onclick="closeSyncProgress(\'' + projectId + '\')">' + t('btn_close') + '</button></div>';
                  body.innerHTML = html;
                }
                var spinner = floatEl.querySelector('.sync-spinner');
                if (spinner) spinner.remove();
                var titleEl = floatEl.querySelector('.title');
                if (titleEl) titleEl.textContent = (success ? '✓ ' : '✗ ') + name + ' · ' + elapsed;
                render();
                break;
              case 'error':
                setPhase(t('sync_phase_error') + ': ' + (event.error || ''), true);
                setBar(100);
                if (barEl) barEl.style.background = 'var(--red)';
                showDone(false, t('sync_phase_error') + (event.error ? ': ' + event.error : ''));
                break;
              case 'retrying':
                var attempt = event.attempt || 1;
                setPhase(t('sync_phase_retrying') + ' (' + attempt + ')...');
                setBar(0);
                if (barEl) barEl.style.background = 'var(--amber)';
                break;
            }
          } catch (e) { /* skip malformed lines */ }
        }
      }
    } catch (e) {
      var isAbort = e.name === 'AbortError' || e.name === 'TimeoutError' || (e.message && e.message.includes('abort'));
      if (isAbort) {
        setPhase(t('sync_timeout'), true);
        showDone(false, t('sync_timeout'));
      } else {
        setPhase(t('sync_phase_error') + ': ' + e.message, true);
        showDone(false, e.message);
      }
    }
  })();
}

function toggleSyncFloat() {
  var el = document.getElementById('sync-float');
  if (el) el.classList.toggle('minimized');
}

function toggleMaxSync() {
  var el = document.getElementById('sync-float');
  if (!el) return;
  if (el.classList.contains('maximized')) {
    el.classList.remove('maximized');
    // 恢复之前的位置和大小
    if (el._prevStyle) {
      el.style.top = el._prevStyle.top;
      el.style.left = el._prevStyle.left;
      el.style.width = el._prevStyle.width;
      el.style.height = el._prevStyle.height;
      el.style.bottom = el._prevStyle.bottom;
      el.style.right = el._prevStyle.right;
    }
  } else {
    // 保存当前位置和大小
    el._prevStyle = {
      top: el.style.top, left: el.style.left,
      width: el.style.width, height: el.style.height,
      bottom: el.style.bottom, right: el.style.right
    };
    el.classList.remove('minimized');
    el.classList.add('maximized');
  }
}

function closeSyncProgress(projectId) {
  // 终止正在进行的同步
  if (window._syncAbort) {
    window._syncAbort.abort();
    window._syncAbort = null;
  }
  var el = document.getElementById('sync-float');
  if (el) el.remove();
  if (projectId) {
    fetchAPIData();
    render();
  }
}

async function analyzeLocal(projectId) {
  const p = state.projects.find(x => x.id === projectId);
  const name = p ? p.name : projectId;

  // 弹出进度窗口
  state.modal = { title: `✨ ${t('analyze_title')} ${name}`, body: `<div id="analyze-log" style="font-family:var(--mono);font-size:12px;line-height:1.8;max-height:400px;overflow-y:auto;color:var(--text-secondary)"><div style="color:var(--text-tertiary)">${t('analyze_connecting')}</div></div>` };
  render();

  const logEl = document.getElementById('analyze-log');
  function appendLog(msg, color) {
    const div = document.createElement('div');
    div.style.color = color || 'var(--text-secondary)';
    div.textContent = msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  try {
    const res = await fetch(`${API_BASE}/api/analyze/${projectId}`, { method: 'POST' });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    let analysisSucceeded = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          const color = evt.status === 'error' ? 'var(--red)' : evt.status === 'success' ? 'var(--green)' : 'var(--text-secondary)';
          appendLog(evt.message, color);

          if (evt.status === 'success' && evt.data) {
            analysisSucceeded = true;
            const d = evt.data;
            const local = state.projects.find(x => x.id === projectId);
            if (local && d) {
              local._llmAnalyzed = d.llm_analyzed;
              local._llmStatus = d.llm_status;
              local._llmSummary = d.llm_summary;
              if (d.todos && d.todos.pending) {
                local.todos = [
                  ...d.todos.pending.map((todo, i) => ({ id: i + 1, name: todo.name, done: false })),
                  ...d.todos.completed.map((todo, i) => ({ id: 100 + i, name: todo.name, done: true })),
                ];
              }
              local.features = (local.features || []).filter(f => !f.name.startsWith(t('issue_prefix')));
              if (d.issues && d.issues.current) {
                d.issues.current.forEach(issue => local.features.push({ name: t('issue_prefix') + issue, done: false }));
              }
            }
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    appendLog(t('analyze_connect_fail') + ': ' + e.message, 'var(--red)');
  }

  if (analysisSucceeded) {
    fetchAPIData();
  }

  // 底部加关闭按钮
  const btnDiv = document.createElement('div');
  btnDiv.style.cssText = 'margin-top:16px;text-align:right';
  btnDiv.innerHTML = `<button class="btn btn-primary btn-sm" onclick="closeModal();render()">${t('btn_close')}</button>`;
  logEl.appendChild(btnDiv);
}

// ==================== LOG VIEWER ====================
let logPanelEl = null;
let logUnsubscribe = null;
let logAutoScroll = true;

function openLogViewer() {
  if (logPanelEl) {
    logPanelEl.classList.toggle('collapsed');
    return;
  }
  const panel = document.createElement('div');
  panel.className = 'log-panel';
  panel.innerHTML = `
    <div class="log-head" onclick="toggleLogPanel()">
      <div class="log-head-left">${icon('terminal')} <span>${t('log_title')}</span></div>
      <div class="log-head-actions">
        <button class="btn btn-sm" onclick="event.stopPropagation();refreshLogs()" title="${t('log_refresh')}">${icon('refresh-cw')} ${t('log_refresh')}</button>
        <button class="btn btn-sm" onclick="event.stopPropagation();clearLogs()" title="${t('log_clear')}">${icon('trash-2')} ${t('log_clear')}</button>
        <button class="btn btn-sm" onclick="event.stopPropagation();closeLogViewer()" title="${t('btn_close')}">${icon('x')}</button>
      </div>
    </div>
    <div class="log-body"><div class="log-empty">${t('loading')}</div></div>`;
  document.body.appendChild(panel);
  logPanelEl = panel;
  if (window.lucide) lucide.createIcons();
  refreshLogs();

  // Subscribe to real-time log updates via Electron IPC
  if (window.electronAPI && window.electronAPI.onLogLine) {
    logUnsubscribe = window.electronAPI.onLogLine(line => appendLogLine(line));
  }
}

function toggleLogPanel() {
  if (logPanelEl) logPanelEl.classList.toggle('collapsed');
}

function closeLogViewer() {
  if (logUnsubscribe) { logUnsubscribe(); logUnsubscribe = null; }
  if (logPanelEl) { logPanelEl.remove(); logPanelEl = null; }
}

async function refreshLogs() {
  if (!logPanelEl) return;
  const body = logPanelEl.querySelector('.log-body');
  if (!body) return;
  body.innerHTML = `<div class="log-empty">${t('loading')}</div>`;
  try {
    let logs = [];
    if (window.electronAPI && window.electronAPI.getLogs) {
      logs = await window.electronAPI.getLogs();
    }
    if (!logs || logs.length === 0) {
      body.innerHTML = `<div class="log-empty">${t('log_no_logs')}</div>`;
      return;
    }
    body.innerHTML = '';
    logs.forEach(line => appendLogLine(line));
  } catch(e) {
    body.innerHTML = `<div class="log-empty">${t('log_no_logs')}</div>`;
  }
}

async function clearLogs() {
  try {
    if (window.electronAPI && window.electronAPI.clearLogs) {
      await window.electronAPI.clearLogs();
    }
  } catch(e) {}
  if (logPanelEl) {
    const body = logPanelEl.querySelector('.log-body');
    if (body) body.innerHTML = `<div class="log-empty">${t('log_no_logs')}</div>`;
  }
}

function appendLogLine(line) {
  if (!logPanelEl) return;
  const body = logPanelEl.querySelector('.log-body');
  if (!body) return;
  // Remove empty placeholder if present
  const empty = body.querySelector('.log-empty');
  if (empty) empty.remove();

  const el = document.createElement('div');
  el.className = 'log-line';
  const ts = line.ts ? new Date(line.ts).toLocaleTimeString('zh-CN', {hour12:false}) : '';
  const level = (line.level || 'info').toLowerCase();
  el.innerHTML = `<span class="log-ts">${ts}</span><span class="log-level ${level}">${level}</span><span class="log-text">${escapeHtml(line.text || '')}</span>`;
  body.appendChild(el);

  if (logAutoScroll) {
    body.scrollTop = body.scrollHeight;
  }
}
